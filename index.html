<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>W2W Cricket Scorer</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="app-shell">
    <header class="topbar">
      <div class="brand">W2W <span>SCORER</span></div>
      <button id="resetBtn" class="ghost-btn" type="button">Reset</button>
    </header>

    <main>
      <section class="match-strip">
        <input id="battingTeam" value="FUGettes Sapphires" aria-label="Batting team" />
        <span class="vs">vs</span>
        <input id="bowlingTeam" value="Malpas A" aria-label="Bowling team" />
      </section>

      <section class="hero-score" aria-live="polite">
        <div id="score" class="score">0/0</div>
        <div id="ballsRemaining" class="balls">60 BALLS REMAINING</div>
        <div id="ballsBowled" class="balls-bowled">0 BALLS BOWLED</div>
      </section>

      <section class="mini-grid">
        <div class="card">
          <label for="striker">Striker</label>
          <input id="striker" value="Player 1" />
          <div class="stat"><span id="strikerRuns">0</span> runs · <span id="strikerBalls">0</span> balls</div>
        </div>
        <div class="card">
          <label for="nonStriker">Non-striker</label>
          <input id="nonStriker" value="Player 2" />
          <div class="stat">Ready</div>
        </div>
        <div class="card wide-card">
          <label for="wideValue">Wide runs</label>
          <select id="wideValue">
            <option value="1">1</option>
            <option value="2" selected>2</option>
            <option value="3">3</option>
            <option value="4">4</option>
            <option value="5">5</option>
          </select>
        </div>
        <div class="card wide-card">
          <label for="noBallValue">No-ball runs</label>
          <select id="noBallValue">
            <option value="1">1</option>
            <option value="2" selected>2</option>
            <option value="3">3</option>
            <option value="4">4</option>
            <option value="5">5</option>
          </select>
        </div>
      </section>

      <section class="scoring-grid" aria-label="Scoring buttons">
        <button data-run="0" class="score-btn">0<span>Dot</span></button>
        <button data-run="1" class="score-btn">1<span>Run</span></button>
        <button data-run="2" class="score-btn">2<span>Runs</span></button>
        <button data-run="3" class="score-btn">3<span>Runs</span></button>
        <button data-run="4" class="score-btn boundary">4<span>Four</span></button>
        <button data-run="6" class="score-btn six">6<span>Six</span></button>
        <button id="wideBtn" class="score-btn extra">WIDE<span id="wideLabel">+2</span></button>
        <button id="noBallBtn" class="score-btn extra">NO BALL<span id="noBallLabel">+2</span></button>
        <button id="wicketBtn" class="score-btn wicket">WICKET<span>-5</span></button>
        <button id="undoBtn" class="score-btn undo">UNDO<span>Last ball</span></button>
      </section>

      <section class="status-row">
        <div><strong>Last event:</strong> <span id="lastEvent">—</span></div>
        <div><strong>Innings:</strong> <span id="inningsLength">60</span> balls</div>
      </section>
    </main>
  </div>

  <script src="app.js"></script>
</body>
</html>
